# Golden SPEC→plan→code evals (MVP-3 B3).
# Fires when role prompts or the eval suite change so a Coder prompt
# regression cannot merge without an evals run.

name: evals

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'packages/ai-roles/src/planner*'
      - 'packages/ai-roles/src/reviewer*'
      - 'docker/aider-sandbox/**'
      - 'tools/evals/**'
      - '.github/workflows/evals.yml'
  push:
    branches: [main]
    paths:
      - '.claude/agents/**'
      - 'packages/ai-roles/src/planner*'
      - 'packages/ai-roles/src/reviewer*'
      - 'docker/aider-sandbox/**'
      - 'tools/evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Run golden evals (offline)
        run: yarn evals
        env:
          # Explicitly offline + noop Langfuse so CI stays deterministic.
          EVALS_LIVE: '0'
          LANGFUSE_PUBLIC_KEY: ''
          LANGFUSE_SECRET_KEY: ''
