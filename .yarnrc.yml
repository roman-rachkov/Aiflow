# Classic node_modules, not PnP.
#
# PnP broke two of the three gate tools on the first real run: Prettier could
# not resolve prettier-plugin-tailwindcss, and ESLint's type-aware project
# service tried to parse .pnp.cjs / .pnp.loader.mjs and failed. Both are
# workaroundable, but the same toolchain goes into the sandbox image, where a
# surprise costs more than PnP's disk saving returns.
#
# Recorded as the resolution of the "yarn verify cannot pass on a clean tree"
# defect in docs/15-engineering-conventions.md § 7.
nodeLinker: node-modules

enableTelemetry: false
