# AI Studio — full dev stack
#
# Topology: postgres, redis, minio, gitea, app, worker, model-router,
# registry-proxy. No `build:` keys — Node services use stock node:22-bookworm
# with the repo bind-mounted and named volumes for node_modules (Windows-safe).
# App Dockerfiles are deferred to prod.
#
# Prerequisites: copy .env.example → .env and set AUTH_SECRET / ENCRYPTION_KEY /
# OPENAI_* (empty OPENAI_API_KEY = MOCK provider).
# Start:  docker compose up
# Ports:  3000 app, 3001 model-router, 3002 Gitea, 3030 Bull Board, 8090 Traefik HTTP,
#         8091 Traefik dashboard, 3100 Langfuse UI, 5432 pg, 6379 redis, 9000/9001 MinIO.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

# Shared settings for every Node workspace service.
x-node-service: &node-service
  image: node:22-bookworm
  working_dir: /workspace
  env_file: .env
  environment: &node-env
    HUSKY: '0'
    CI: 'true'
    WATCHPACK_POLLING: 'true'
    CHOKIDAR_USEPOLLING: 'true'
    # Next webpack bundles @aiflow/db's generated Prisma clients into `.next`
    # without copying query engines; Prisma then searches the wrong dirs and
    # fails with "Could not locate the Query Engine for debian-openssl-3.0.x".
    # Point at the Linux engine on the bind mount (binaryTargets includes it).
    PRISMA_QUERY_ENGINE_LIBRARY: /workspace/packages/db/generated/public/libquery_engine-debian-openssl-3.0.x.so.node
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  # bash (not exec bit): bind mounts from Windows often lack +x.
  entrypoint: ['bash', '/workspace/docker/dev-entrypoint.sh']
  volumes: &node-volumes
    - .:/workspace
    # Named volumes keep node_modules on the Linux VM FS (critical on Windows).
    - node_modules:/workspace/node_modules
    - web_node_modules:/workspace/apps/web/node_modules
    - worker_node_modules:/workspace/apps/worker/node_modules
    - model_router_node_modules:/workspace/services/model-router/node_modules
    - registry_proxy_node_modules:/workspace/services/registry-proxy/node_modules
    - db_node_modules:/workspace/packages/db/node_modules
    - ui_node_modules:/workspace/packages/ui/node_modules
    - ai_roles_node_modules:/workspace/packages/ai-roles/node_modules
    - queue_node_modules:/workspace/packages/queue/node_modules
    - crypto_node_modules:/workspace/packages/crypto/node_modules
    - session_analyzer_node_modules:/workspace/tools/session-analyzer/node_modules
    - yarn_cache:/root/.yarn/berry/cache
    - yarn_install_stamp:/var/cache/aiflow-yarn
    # Shared so sandbox-only services can run `yarn` without downloading Corepack.
    - corepack_home:/root/.cache/node/corepack
    # Written by gitea-init; app/worker read GITEA_ADMIN_TOKEN_FILE from here.
    - gitea_bootstrap:/run/gitea:ro
  networks:
    - internal
  restart: unless-stopped

services:
  postgres:
    # pgvector, not stock postgres:16 — RAG embeddings live in the project
    # schemas (DocumentChunk), so the extension must exist from the start.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_studio}
      POSTGRES_DB: ai_studio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ai_studio} -d ai_studio']
      <<: *healthcheck-defaults
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly buys durability for queue state, but Redis is still treated as
    # disposable: task progress is checkpointed to TaskLog in Postgres.
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      <<: *healthcheck-defaults
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      <<: *healthcheck-defaults
    networks:
      - internal
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.22
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__DOMAIN: localhost
      GITEA__server__SSH_DOMAIN: localhost
      # Gitea listens on 3000 inside the container and is published on 3002.
      # ROOT_URL is what a browser sees; platform services reach it as
      # gitea:3000 over the internal network. Both numbers are correct in
      # their own context — do not "fix" one to match the other.
      GITEA__server__ROOT_URL: http://localhost:3002/
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:-change-me}
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - '3002:3000'
    volumes:
      - gitea_data:/data
    healthcheck:
      # Runs inside the container, hence 3000 rather than 3002.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/healthz || exit 1']
      <<: *healthcheck-defaults
    networks:
      - internal
    restart: unless-stopped

  # Idempotent Gitea admin user + API token after a fresh volume wipe.
  # Writes /run/gitea/token into the gitea_bootstrap volume for app/worker.
  gitea-init:
    image: gitea/gitea:1.22
    # Root only to chown the bootstrap volume; CLI runs as git (su-exec).
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_REPO_OWNER: ${GITEA_REPO_OWNER:-aistudio}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-aistudio@example.com}
      # Prefer existing .env token when still valid; else mint a new one.
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN:-}
      GITEA_ADMIN_TOKEN_FILE: /run/gitea/token
    volumes:
      - gitea_data:/data
      - gitea_bootstrap:/run/gitea
      - ./docker/gitea/bootstrap.sh:/bootstrap.sh:ro
    entrypoint:
      [
        'bash',
        '-c',
        'mkdir -p /run/gitea && chown -R git:git /run/gitea && exec su-exec git bash /bootstrap.sh',
      ]
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'

  app:
    <<: *node-service
    environment:
      <<: *node-env
      ROLE: app
      PORT: 3000
      # Bind all interfaces — must not use Docker HOSTNAME (breaks healthcheck).
      LISTEN_HOST: '0.0.0.0'
      # Token file from gitea-init (falls back to GITEA_ADMIN_TOKEN in .env).
      GITEA_ADMIN_TOKEN_FILE: /run/gitea/token
      # Override host-side .env (localhost) so migrate/app reach compose DNS.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_studio}:${POSTGRES_PASSWORD:-ai_studio}@postgres:5432/ai_studio?schema=public
      # Langfuse SDK (B2): reach langfuse-web on the compose network, not host :3100.
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
    command: ['yarn', 'workspace', '@aiflow/web', 'dev']
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gitea:
        condition: service_healthy
      gitea-init:
        condition: service_completed_successfully
    healthcheck:
      # node:22-bookworm has no curl; Node 22 has global fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
      start_period: 120s

  worker:
    <<: *node-service
    environment:
      <<: *node-env
      ROLE: worker
      QUEUES: 'spec-generate,plan-generate,code-execute,code-review,deploy-run,chat-run'
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_studio}:${POSTGRES_PASSWORD:-ai_studio}@postgres:5432/ai_studio?schema=public
      GITEA_ADMIN_TOKEN_FILE: /run/gitea/token
      # Compose names the network `{project}_sandbox` (dir name → aiflow_sandbox).
      SANDBOX_NETWORK: aiflow_sandbox
      # Build once (not a compose service — stock images only):
      # docker build -t aistudio/aider-sandbox:latest -f docker/aider-sandbox/Dockerfile docker/aider-sandbox
      AIDER_SANDBOX_IMAGE: aistudio/aider-sandbox:latest
      USER_TEMPLATE_DIR: /workspace/templates/user-nextjs
      # Langfuse SDK (B2): same as app — compose DNS, not host port.
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
      # Domain deploy (MVP-2 4.3): Traefik routes app-{hex}.localhost → user container.
      DEPLOY_DOMAIN_ENABLED: ${DEPLOY_DOMAIN_ENABLED:-false}
      DEPLOY_PUBLIC_BASE: ${DEPLOY_PUBLIC_BASE:-http://localhost:8090}
      TRAEFIK_NETWORK: ${COMPOSE_PROJECT_NAME:-aiflow}_internal
      DOGFOOD_FIXTURE: ${DOGFOOD_FIXTURE:-}
      SANDBOX_RUN_AS: ${SANDBOX_RUN_AS:-}
    command: ['yarn', 'workspace', '@aiflow/worker', 'dev']
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - worker_node_modules:/workspace/apps/worker/node_modules
      - model_router_node_modules:/workspace/services/model-router/node_modules
      - registry_proxy_node_modules:/workspace/services/registry-proxy/node_modules
      - db_node_modules:/workspace/packages/db/node_modules
      - ui_node_modules:/workspace/packages/ui/node_modules
      - ai_roles_node_modules:/workspace/packages/ai-roles/node_modules
      - queue_node_modules:/workspace/packages/queue/node_modules
      - crypto_node_modules:/workspace/packages/crypto/node_modules
      - session_analyzer_node_modules:/workspace/tools/session-analyzer/node_modules
      - yarn_cache:/root/.yarn/berry/cache
      - yarn_install_stamp:/var/cache/aiflow-yarn
      - corepack_home:/root/.cache/node/corepack
      - gitea_bootstrap:/run/gitea:ro
      # DEV-ONLY (open question #4): host docker.sock gives full Docker control.
      # Production must use remote Docker (TLS), a dedicated Docker host, or K8s
      # Jobs — do not mount the host socket. Vault/Swarm secrets are out of scope.
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_temp:/tmp/sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gitea-init:
        condition: service_completed_successfully
    networks:
      - internal
      - sandbox
    # No healthcheck: worker is still a tsx-watch stub.

  model-router:
    <<: *node-service
    environment:
      <<: *node-env
      ROLE: model-router
      PORT: 3001
    command: ['yarn', 'workspace', '@aiflow/model-router', 'dev']
    ports:
      - '3001:3001'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
      start_period: 60s

  registry-proxy:
    <<: *node-service
    environment:
      <<: *node-env
      ROLE: registry-proxy
      # Entrypoint refuses yarn install when set (sandbox has no registry egress).
      NO_EGRESS: '1'
      PORT: 3128
      # Expandable allowlist for sandbox package/CDN egress (add hosts as needed).
      ALLOWED_HOSTS: >-
        registry.npmjs.org,registry.yarnpkg.com,pypi.org,github.com,
        objects.githubusercontent.com,nodejs.org,cdn.jsdelivr.net
    command: ['yarn', 'workspace', '@aiflow/registry-proxy', 'dev']
    # Sandbox is internal:true — no egress for yarn install. Wait until `app`
    # has populated the shared stamp + node_modules volumes; entrypoint then
    # skips install/generate when ready (or fails fast if not).
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sandbox
    # Sandbox-only: no internal network, no published ports, no healthcheck.

  # ---------------------------------------------------------------------------
  # Langfuse (MVP-3 B1) — LLM observability UI. Dedicated Redis + ClickHouse;
  # OLTP DB `langfuse` on shared Postgres; events/media on shared MinIO.
  # UI: http://localhost:3100  (SDK tracing via @aiflow/ai-roles → B2)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    # Do not publish 9000 — host 9000 is MinIO. HTTP stays internal-only.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping || exit 1']
      <<: *healthcheck-defaults
    networks:
      - internal
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Traefik — reverse proxy for domain deploy (MVP-2 4.3). Routes Host app-{hex}.localhost.
  traefik:
    image: traefik:v3.0
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - '8090:80'
      - '8091:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    restart: unless-stopped

  # Bull Board — dev-only BullMQ dashboard on host port 3030.
  # Set BULL_BOARD_USER / BULL_BOARD_PASSWORD in .env to enable Basic auth.
  bull-board:
    <<: *node-service
    command: ['bash', '-c', 'node_modules/.bin/tsx tools/bull-board/src/index.ts']
    environment:
      <<: *node-env
      ROLE: bull-board
      BULL_BOARD_PORT: '3030'
      # Optional: set to enable Basic auth (dev can leave empty).
      BULL_BOARD_USER: ${BULL_BOARD_USER:-}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}
    ports:
      - '3030:3030'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - bull_board_node_modules:/workspace/tools/bull-board/node_modules
      - queue_node_modules:/workspace/packages/queue/node_modules
      - yarn_cache:/root/.yarn/berry/cache
      - yarn_install_stamp:/var/cache/aiflow-yarn
      - corepack_home:/root/.cache/node/corepack
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  langfuse-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:-langfuse-dev-redis}
      - --maxmemory-policy
      - noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$LANGFUSE_REDIS_AUTH" redis-cli ping | grep -q PONG']
      <<: *healthcheck-defaults
    environment:
      LANGFUSE_REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-langfuse-dev-redis}
    networks:
      - internal
    restart: unless-stopped

  minio-langfuse-init:
    image: minio/mc:latest
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      LANGFUSE_S3_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
    volumes:
      - ./docker/minio/ensure-langfuse-bucket.sh:/ensure-langfuse-bucket.sh:ro
    entrypoint: ['sh', '/ensure-langfuse-bucket.sh']
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-langfuse-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_studio}:${POSTGRES_PASSWORD:-ai_studio}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3100}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-dev-nextauth-secret-change-me}
      SALT: ${LANGFUSE_SALT:-langfuse-dev-salt-change-me}
      # Must be 64 hex chars (openssl rand -hex 32) — not AI Studio ENCRYPTION_KEY.
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: langfuse-redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-langfuse-dev-redis}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    networks:
      - internal
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    depends_on: *langfuse-depends-on
    ports:
      - '3100:3000'
    environment:
      <<: *langfuse-env
      # Browser-reachable MinIO for media (host publish 9000).
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-aistudio}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-AI Studio}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-aistudio-dev}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-AI Studio Dev}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-langfuse@localhost}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Langfuse Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-langfuselangfuse}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/public/health || exit 1']
      <<: *healthcheck-defaults
      start_period: 90s
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

  # Isolation invariant: a sandbox reaches nothing but registry-proxy.
  sandbox:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  gitea_data:
  gitea_bootstrap:
  worker_temp:
  clickhouse_data:
  clickhouse_logs:
  langfuse_redis_data:
  node_modules:
  web_node_modules:
  worker_node_modules:
  model_router_node_modules:
  registry_proxy_node_modules:
  db_node_modules:
  ui_node_modules:
  ai_roles_node_modules:
  queue_node_modules:
  crypto_node_modules:
  session_analyzer_node_modules:
  bull_board_node_modules:
  yarn_cache:
  yarn_install_stamp:
  corepack_home:
